/#
Массив содержит целевую влажность, замеры по зонам и поправку на полив.
У каждой зоны два замера влажности в процентах.
#/
(define target_moisture 0b110010);
array(
    ?{target_moisture},
    array(
        array(0b101110, 0b110000),
        array(0b110011, 0b110101)
    ),
    ?{abs(-54 + target_moisture)}
)
